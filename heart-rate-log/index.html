<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Heart Rate Log</title>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#111318" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <h1 id="pageTitle">New Entry</h1>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button class="tab-btn" data-tab="entry" aria-label="New Entry">
    <span class="tab-icon">＋</span><span>Log</span>
  </button>
  <button class="tab-btn" data-tab="history" aria-label="History">
    <span class="tab-icon">☰</span><span>History</span>
  </button>
  <button class="tab-btn" data-tab="settings" aria-label="Settings">
    <span class="tab-icon">⚙</span><span>Settings</span>
  </button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="js/schema.js"></script>
<script src="js/themes.js"></script>
<script src="js/airtable.js"></script>
<script src="js/app.js"></script>
</body>
</html>
